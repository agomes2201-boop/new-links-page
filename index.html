<title>Degustarte BH</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:45px 18px;
 display:flex;justify-content:center;
 font-family:Arial,sans-serif;color:#54251f;
 background:linear-gradient(160deg,#faf6ef,#eee3d5);
}
main{width:100%;max-width:430px;text-align:center}
.logo{
 width:110px;height:110px;margin:0 auto 20px;
 border:2px solid #b7955b;border-radius:50%;
 background:#54251f;color:#f7f1e8;
 display:flex;align-items:center;justify-content:center;
 font:italic 65px Georgia,serif;
}
h1{font:600 42px Georgia,serif;margin:5px 0}
.location{letter-spacing:4px;color:#b7955b;font-size:11px}
.description{color:#8c766d;font-size:14px;margin:15px 0 28px}
.links{display:grid;gap:13px}
.link{
 display:block;padding:19px 12px;
 border:1px solid #54251f;border-radius:9px;
 background:#54251f;color:#fffaf3;
 text-decoration:none;font-size:14px;font-weight:bold;
 transition:.2s;
}
.link:hover{background:#713d34;transform:translateY(-2px)}
.social{margin-top:35px}
.social a{color:#54251f;text-decoration:none;margin:0 12px}
footer{margin-top:25px;color:#9b8578;font-size:11px}
</style>
</head>
